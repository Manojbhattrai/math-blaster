<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Blaster</title>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(to bottom,#020024,#090979,#000000);
color:white;
overflow:hidden;
}

h1{
text-align:center;
margin-top:20px;
font-size:45px;
}

.space{
display:flex;
justify-content:space-evenly;
align-items:center;
height:60vh;
}

.planet{
width:180px;
height:180px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 20px rgba(255,255,255,0.5);
transition:0.3s;
}

.planet:hover{
transform:scale(1.1);
}

.planet1{
background:orange;
}

.planet2{
background:deepskyblue;
}

.rocket{
position:fixed;
top:80%;
left:45%;
font-size:80px;
z-index:1000;
transition:all 2s linear;
}

.quizPage{
width:100vw;
height:100vh;
overflow-y:auto;
background:linear-gradient(to bottom,#020024,#090979,#000000);
}

.game-container{
display:flex;
justify-content:space-between;
padding:20px;
gap:20px;
}

.questions{
width:75%;
}

.question-row{
display:flex;
align-items:center;
gap:15px;
margin-bottom:25px;
background:rgba(255,255,255,0.08);
padding:15px;
border-radius:20px;
flex-wrap:wrap;
}

.question-text{
background:white;
color:black;
padding:8px 18px;
font-size:24px;
font-weight:bold;
border-radius:10px;
min-width:150px;
font-family:cursive;
}

.star-box{
width:70px;
height:65px;
background:white;
color:black;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
border-radius:10px;
position:relative;
}

.star-number{
position:absolute;
left:8px;
bottom:5px;
font-size:18px;
font-weight:bold;
}

.equal-box{
width:65px;
height:65px;
background:white;
color:black;
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
border-radius:10px;
}

.drop-box{
width:170px;
height:70px;
border:4px dashed #4d5fff;
border-radius:20px;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
color:white;
background:rgba(255,255,255,0.05);
}

.options{
width:20%;
display:flex;
flex-direction:column;
gap:20px;
}

.option{
background:white;
color:black;
padding:20px;
text-align:center;
font-size:26px;
font-weight:bold;
border:3px solid #35506b;
border-radius:10px;
cursor:grab;
touch-action:none;
}

.submit-btn{
display:block;
margin:30px auto;
padding:18px 50px;
font-size:28px;
border:none;
border-radius:25px;
background:linear-gradient(to right,limegreen,#00cc66);
color:white;
cursor:pointer;
font-weight:bold;
box-shadow:0 0 20px lime;
}

.flip-btn{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
padding:18px 35px;
font-size:28px;
border:none;
border-radius:20px;
background:orange;
color:white;
cursor:pointer;
font-weight:bold;
box-shadow:0 0 20px orange;
z-index:9999;
}

.answerBox{
display:none;
margin-top:10px;
padding:10px;
font-size:24px;
font-weight:bold;
border-radius:15px;
color:white;
}

.correct{
background:green;
}

.wrong{
background:red;
}

.result-card{
margin:10px auto;
padding:10px;
border-radius:18px;
width:92%;
display:flex;
align-items:center;
justify-content:center;
gap:10px;
flex-wrap:wrap;
min-height:90px;
}

@media(max-width:768px){

body{
overflow-x:hidden;
}

.game-container{
display:flex;
flex-direction:row;
justify-content:space-between;
align-items:flex-start;
padding:5px;
gap:5px;
}

.questions{
width:70%;
}

.question-row{
display:flex;
align-items:center;
gap:4px;
padding:8px;
margin-bottom:10px;
border-radius:15px;
min-height:95px;
}

.options{
width:25%;
display:flex;
flex-direction:column;
justify-content:flex-start;
align-items:center;
gap:18px;
padding-top:5px;
}

.option{
width:70px;
height:42px;
display:flex;
justify-content:center;
align-items:center;
font-size:14px;
padding:0;
border-radius:12px;
}

.question-text{
font-size:13px;
min-width:75px;
padding:5px 6px;
}

.star-box{
width:42px;
height:42px;
font-size:16px;
}

.star-number{
font-size:11px;
left:4px;
bottom:3px;
}

.equal-box{
width:38px;
height:38px;
font-size:24px;
}

.drop-box{
width:70px;
height:42px;
font-size:14px;
border-width:2px;
}

.submit-btn{
font-size:15px;
padding:10px 15px;
margin-top:10px;
width:90%;
}

.flip-btn{
font-size:16px;
padding:10px 15px;
width:85%;
}

h1{
font-size:20px;
margin-top:10px;
}

}




</style>
</head>

<body>

<h1>🚀 MATH BLASTERS</h1>

<div class="rocket" id="rocket">🚀</div>

<div class="space">

<div class="planet planet1" onclick="moveRocket('planet1')">
Planet 1
</div>

<div class="planet planet2" onclick="moveRocket('planet2')">
Planet 2
</div>

</div>

<script>

let selectedPlanet="";

function moveRocket(planet){

selectedPlanet=planet;

const rocket=document.getElementById("rocket");

if(planet==="planet1"){

const planetElement=document.querySelector(".planet1");

const rect=planetElement.getBoundingClientRect();

rocket.style.left=rect.left + rect.width/2 - 40 + "px";
rocket.style.top=rect.top + rect.height/2 - 40 + "px";

}

if(planet==="planet2"){

const planetElement=document.querySelector(".planet2");

const rect=planetElement.getBoundingClientRect();

rocket.style.left=rect.left + rect.width/2 - 40 + "px";
rocket.style.top=rect.top + rect.height/2 - 40 + "px";

}

setTimeout(()=>{

const boom=document.createElement("div");

boom.innerHTML="💥";

boom.style.position="fixed";
boom.style.left=rocket.style.left;
boom.style.top=rocket.style.top;
boom.style.fontSize="120px";
boom.style.zIndex="9999";

document.body.appendChild(boom);

rocket.style.display="none";

setTimeout(()=>{

boom.remove();

startGame();

},1000);

},2000);

}

function startGame(){

let questionsHTML="";
let optionsHTML="";

if(selectedPlanet==="planet1"){

questionsHTML=`

${createQuestion("Half","36","18")}
${createQuestion("One third","36","12")}
${createQuestion("One quarter","36","9")}
${createQuestion("One ninth","36","4")}

`;

optionsHTML=`

<div class="option">4</div>
<div class="option">18</div>
<div class="option">9</div>
<div class="option">12</div>

`;

}

if(selectedPlanet==="planet2"){

questionsHTML=`

${createQuestion("Half","35","17 1/2")}
${createQuestion("One third","35","11 2/3")}
${createQuestion("One ninth","36","4")}
${createQuestion("One ninth","35","3 8/9")}

`;

optionsHTML=`

<div class="option">4</div>
<div class="option">17 1/2</div>
<div class="option">3 8/9</div>
<div class="option">11 2/3</div>

`;

}

document.body.innerHTML=`

<div class="quizPage">

<h1>🚀 MATH BLASTERS</h1>

<div class="game-container">

<div class="questions">

${questionsHTML}

<button class="submit-btn" onclick="checkAnswers()">
🚀 SUBMIT ANSWERS
</button>

</div>

<div class="options" id="optionsBox">

${optionsHTML}

</div>

</div>

</div>

`;

initializeDragDrop();

}

function createQuestion(name,num,answer){

return `
<div class="question-row">

<div class="question-text">${name}</div>

<div class="star-box">
⭐
<div class="star-number">${num}</div>
</div>

<div class="equal-box">=</div>

<div class="drop-box"
data-answer="${answer}"
data-question="${name}"
data-number="${num}">
</div>

</div>
`;

}

function initializeDragDrop(){

new Sortable(document.getElementById('optionsBox'),{
group:'shared',
animation:150
});

document.querySelectorAll('.drop-box').forEach(box=>{

new Sortable(box,{
group:'shared',
animation:150
});

});

}

function checkAnswers(){

const boxes=document.querySelectorAll(".drop-box");

let correct=0;
let wrong=0;

let resultHTML="";

boxes.forEach((box)=>{

const correctAnswer=box.dataset.answer;
const question=box.dataset.question;
const number=box.dataset.number;

let userAnswer="";

if(box.querySelector(".option")){
userAnswer=box.querySelector(".option").innerText.trim();
}

const isCorrect=userAnswer===correctAnswer;

if(isCorrect){
correct++;
}else{
wrong++;
}

resultHTML+=`

<div class="result-card"
style="
border:3px solid ${isCorrect ? 'lime' : 'red'};
background:rgba(255,255,255,0.08);
">

<h2 style="color:${isCorrect ? 'lime' : 'red'};width:100%;">
${isCorrect ? '✅ Correct' : '❌ Wrong'}
</h2>

<div class="question-text">${question}</div>

<div class="star-box">
⭐
<div class="star-number">${number}</div>
</div>

<div class="equal-box">=</div>

<div class="answerBox ${isCorrect ? 'correct' : 'wrong'}">
✅ Correct Answer: ${correctAnswer}
</div>

</div>

`;

});

if(correct===4){

document.body.innerHTML=`

<div id="winScreen" style="
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:black;
text-align:center;
cursor:pointer;
">

<div style="font-size:120px;">🎉🚀🥳</div>

<h1 style="font-size:70px;color:lime;">
HURRAY! YOU WON!
</h1>

<p style="font-size:30px;">
All answers are correct 🌟
</p>

<p style="
font-size:24px;
color:yellow;
margin-top:20px;
">
✅ Tap anywhere to play again
</p>

</div>

`;

setTimeout(()=>{

document.getElementById("winScreen").onclick=function(){
location.reload();
}

},500);

}else{

document.body.innerHTML=`

<div style="
height:100vh;
padding:15px;
background:linear-gradient(to bottom,#020024,#090979,#000000);
text-align:center;
overflow-y:auto;
box-sizing:border-box;
padding-bottom:120px;
">

<h1 style="
font-size:45px;
color:red;
margin:10px 0;
">
🚨 OH NO!
</h1>

<h2 style="
font-size:28px;
margin-bottom:15px;
">
You made ${wrong} questions wrong.
</h2>

${resultHTML}

<button
class="flip-btn"
onclick="flipAnswers(event)"
id="flipBtn">
🔄 Flip All Answers
</button>

<p id="homeText"
style="
display:none;
font-size:25px;
margin-top:20px;
color:yellow;
font-weight:bold;
">
✅ Tap anywhere to go home
</p>

</div>

`;

}

}

function flipAnswers(event){

event.stopPropagation();

const answers=document.querySelectorAll(".answerBox");

answers.forEach(answer=>{
answer.style.display="block";
});

document.getElementById("flipBtn").style.display="none";

document.getElementById("homeText").style.display="block";

setTimeout(()=>{

document.body.onclick=function(){
location.reload();
}

},500);

}

</script>

</body>
</html>
