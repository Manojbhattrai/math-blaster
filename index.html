<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MATH BLASTERS</title>
  <style>
    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      position: relative;
      background: linear-gradient(to right, #020024, #090979, #000000);
      font-family: Arial, sans-serif;
      color: white;
      touch-action: manipulation;
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #020024, #090979, #000000);
      color: white;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      margin-top: 20px;
      font-size: 40px;
    }

    p {
      font-size: 18px;
    }

    .space {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      width: 100%;
      height: 55vh;
      margin-top: 20px;
      flex-direction: row;
    }

    .planet {
      position: relative;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 22px;
      font-weight: bold;
      transition: transform 0.3s ease;
      box-shadow: 0 0 20px rgba(255,255,255,0.5);
    }

    .planet:hover {
      transform: scale(1.1);
    }

    .robot {
      width: 80px;
      position: absolute;
      bottom: 30px;
      left: 42%;
      transition: all 2s ease-in-out;
      font-size: 70px;
      z-index: 1000;
    }

    .planet1 {
      background: orange;
    }

    .planet2 {
      background: deepskyblue;
    }

    .quiz-box {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 45vh;
      overflow-y: auto;
      background: rgba(0,0,0,0.85);
      border-top-left-radius: 25px;
      border-top-right-radius: 25px;
      padding: 20px;
      margin-top: 40px;
      display: none;
      background: rgba(255,255,255,0.1);
      width: 350px;
      margin-left: auto;
      margin-right: auto;
      padding: 20px;
      border-radius: 15px;
    }

    input {
      padding: 10px;
      width: 80%;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #00c3ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #008cff;
    }

    #result {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    .score {
      margin-top: 20px;
      font-size: 22px;
    }
  

    @media screen and (max-width: 768px) {
      .space {
        flex-direction: row;
        justify-content: space-around;
        align-items: center;
      }

      .planet {
        width: 140px;
        height: 140px;
        font-size: 22px;
      }

      .robot {
        font-size: 70px;
      }

      .quiz-box {
        height: 48vh;
        padding: 15px;
      }

      button {
        font-size: 20px;
      }
    }
      body {
        overflow-x: hidden;
      }

      h1 {
        font-size: 24px;
      }

      p {
        font-size: 16px;
      }

      .space {
        margin-top: 140px;
        gap: 10px;
      }

      .planet {
        width: 130px;
        height: 130px;
        font-size: 18px;
      }

      .robot {
        font-size: 65px;
        left: 40%;
        bottom: 20px;
      }

      .quiz-box {
        width: 92%;
        margin-top: 30px;
        padding: 15px;
        border-radius: 20px;
      }

      button {
        font-size: 18px;
        padding: 14px 20px;
      }

      #questionsContainer label {
        font-size: 20px;
      }
    

      h1 {
        font-size: 28px;
      }

      .planet {
        width: 120px;
        height: 120px;
        font-size: 18px;
      }

      .quiz-box {
        width: 92%;
        padding: 15px;
      }

      input {
        font-size: 18px;
      }
    
  </style>
</head>
<body>

  <h1>🚀 MATH BLASTERS</h1>

  <div class="robot" id="robot">🚀</div>

  <div class="space">
    <div class="planet planet1" onclick="moveRobot('planet1')">Planet 1</div>
    <div class="planet planet2" onclick="moveRobot('planet2')">Planet 2</div>
  </div>

  <div class="quiz-box" id="quizBox">
    <h2>🌟 Solve All Questions</h2>

    <div id="questionsContainer"></div>

    <button onclick="checkAnswers()" style="width:100%; font-size:24px; padding:18px; margin-top:20px; border-radius:20px; background:limegreen;">
      ✅ Submit All Answers
    </button>

    <div id="result"></div>

    <div id="wrongAnswers"></div>
  </div>

  <div class="score">
    Score: <span id="score">0</span>
  </div>

  <script>
    let score = 0;
    let selectedPlanet = '';
    let currentQuestions = [];

    function moveRobot(planet) {
      document.querySelectorAll('.planet').forEach(p => {
        p.style.boxShadow = '0 0 20px rgba(255,255,255,0.5)';
      });

      const selectedPlanetElement = document.querySelector(`.${planet}`);
      selectedPlanetElement.style.boxShadow = '0 0 40px lime';

      const rocket = document.getElementById('robot');

      if (planet === 'planet1') {
        rocket.style.left = '18%';
        rocket.style.bottom = '360px';
      }

      if (planet === 'planet2') {
        rocket.style.left = '65%';
        rocket.style.bottom = '360px';
      }

      setTimeout(() => {
        const explosion = document.createElement('div');

        explosion.innerHTML = '💥';
        explosion.style.position = 'absolute';
        explosion.style.left = rocket.style.left;
        explosion.style.bottom = rocket.style.bottom;
        explosion.style.fontSize = '100px';
        explosion.style.zIndex = '2000';

        document.body.appendChild(explosion);

        setTimeout(() => {
          explosion.remove();
          startGame();
        }, 800);

      }, 2000);
    }

    function startGame() {
      document.body.innerHTML = `
        <div style="width:100vw;height:100vh;background:linear-gradient(to right,#020024,#090979,#000000);color:white;font-family:Arial,sans-serif;overflow:hidden;">
          <h1 style="text-align:center;">🚀 Space Math Game</h1>
          <p style="text-align:center;">🌟 Solve all questions and submit!</p>

          <div class="quiz-box" id="quizBox" style="display:block;width:100%;height:85vh;position:relative;background:rgba(0,0,0,0.9);overflow-y:auto;">
            <h2>🌟 Solve All Questions</h2>
            <div id="questionsContainer"></div>

            <button onclick="checkAnswers()" style="width:100%; font-size:24px; padding:18px; margin-top:20px; border-radius:20px; background:limegreen;">
              ✅ Submit All Answers
            </button>

            <div id="result"></div>
            <div id="wrongAnswers"></div>
          </div>
        </div>
      `;
      

      const questionsContainer = document.getElementById('questionsContainer');
      questionsContainer.innerHTML = '';

      currentQuestions = [];

      const questionPool = [
        { q: '1/2 + 1/2', a: '1' },
        { q: '3/4 + 1/4', a: '1' },
        { q: '1/3 + 1/3', a: '2/3' },
        { q: '2/5 + 1/5', a: '3/5' },
        { q: '5 + 7', a: '12' },
        { q: '9 - 4', a: '5' },
        { q: '6 × 3', a: '18' },
        { q: '20 ÷ 5', a: '4' }
      ];

      for (let i = 0; i < 5; i++) {
        const randomQuestion = questionPool[Math.floor(Math.random() * questionPool.length)];
        currentQuestions.push(randomQuestion);

        const wrongOptions = questionPool
          .map(q => q.a)
          .filter(ans => ans !== randomQuestion.a)
          .sort(() => Math.random() - 0.5)
          .slice(0, 3);

        const options = [randomQuestion.a, ...wrongOptions].sort(() => Math.random() - 0.5);

        options.sort(() => Math.random() - 0.5);

        questionsContainer.innerHTML += `
          <div style="margin-bottom:25px; background:rgba(255,255,255,0.1); padding:15px; border-radius:15px;">
            <label style="font-size:20px;">🪐 ${randomQuestion.q} = </label>

            <div ondrop="drop(event)" ondragover="allowDrop(event)"
              id="drop${i}"
              data-answer="${randomQuestion.a}"
              style="margin:15px auto; width:120px; height:50px; border:2px dashed white; border-radius:10px; line-height:50px;">
              Drop Answer Here
            </div>

            <div style="display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:15px;">
              ${options.map(option => `
                <div draggable="true"
                  ondragstart="drag(event)"
                  id="drag${i}${option}"
                  data-value="${option}"
                  style="background:#00c3ff; padding:12px 18px; border-radius:14px; cursor:pointer; color:white; font-weight:bold; font-size:20px; min-width:60px; text-align:center;">
                  ${option}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      document.getElementById('result').innerText = '';
      document.getElementById('wrongAnswers').innerHTML = '';
    }

    function checkAnswers() {
      let correctCount = 0;
      let wrongList = '';

      currentQuestions.forEach((question, index) => {
        const userAnswer = document.getElementById(`drop${index}`).innerText.trim();

        if (userAnswer == question.a) {
          correctCount++;
        } else {
          wrongList += `
            <div style="margin-top:10px; background:#222; padding:10px; border-radius:10px;">
              ❌ Question: ${question.q}<br>
              
              <div style="display:none; margin-top:8px; color:yellow;">
                Correct Answer: ${question.a}
              </div>
            </div>
          `;
        }
      });

      if (correctCount === currentQuestions.length) {
        document.getElementById('quizBox').innerHTML = `
          <div style="padding:40px;">
            <div style="padding:40px; text-align:center;">
            <div style="font-size:80px;">🎉🥳🚀</div>
            <h1 style="color:lime; font-size:50px;">HURRAH! 🏆 YOU WON!</h1>
            <p style="font-size:24px;">All answers are correct! Great job space explorer 🌟</p>
            <button onclick="location.reload()">Play Again</button>
          </div>
        `;

        score++;
      } else {
        let resultPage = `
          <div style="padding:20px;">
            <h1 style="color:red;">🚨 Oh No!</h1>
            <h2>You made ${currentQuestions.length - correctCount} wrong questions.</h2>
        `;

        currentQuestions.forEach((question, index) => {
          const userAnswer = document.getElementById(`drop${index}`).innerText.trim();
          const isCorrect = userAnswer == question.a;

          resultPage += `
            <div style="margin-top:20px; background:rgba(255,255,255,0.1); padding:15px; border-radius:15px; border:2px solid ${isCorrect ? 'lime' : 'red'};">
              <h3 style="color:${isCorrect ? 'lime' : 'red'};">
                ${isCorrect ? '✅ Correct' : '❌ Wrong'}
              </h3>

              <p>${question.q}</p>

              

              <div data-hidden-answer="true" style="display:none; margin-top:10px; font-size:26px; font-weight:bold; color:${isCorrect ? 'lime' : 'red'};">
                ${question.a}
              </div>
            </div>
          `;
        });

        resultPage += `
            <br>
            <button id="flipAllBtn" onclick="flipAllAnswers()" style="margin-top:20px; font-size:22px; padding:15px 25px; border-radius:15px;">
              🔄 Flip All Answers
            </button>

            <p id="homeMessage" style="display:none; margin-top:20px; font-size:24px; color:yellow; font-weight:bold;">
              ✅ Tap anywhere on the screen to go back to the home page.
            </p>
          </div>
        `;

        document.getElementById('quizBox').innerHTML = resultPage;
      }

      document.getElementById('score').innerText = score;
    }

    function allowDrop(ev) {
      ev.preventDefault();
    }

    function drag(ev) {
      ev.dataTransfer.setData('text', ev.target.getAttribute('data-value'));
    }

    function drop(ev) {
      ev.preventDefault();
      const data = ev.dataTransfer.getData('text');
      ev.target.innerText = data;
    }

    function flipAllAnswers() {
      const answers = document.querySelectorAll('[data-hidden-answer]');

      answers.forEach(answer => {
        answer.style.display = 'block';
      });

      const flipButton = document.getElementById('flipAllBtn');
      flipButton.style.display = 'none';

      document.getElementById('homeMessage').style.display = 'block';

      setTimeout(() => {
        document.body.onclick = function() {
          location.reload();
        }
      }, 500);
    }
  
  
  </script>

</body>
</html>
